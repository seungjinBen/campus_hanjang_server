spring:
  profiles:
    active: dev
  application:
    name: campus-hanjang
  datasource:
    url: jdbc:postgresql://localhost:5432/campus
    username: bsjworld
    password: seungjin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 2592000000

kakao:
  client-id: 8579221dc3dd585ce61aafcdcf77cb16
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: https://campushanjang.kr/auth/kakao/callback

firebase:
  project-id: campushanjang
  storage-bucket: campushanjang.firebasestorage.app
  service-account-key: ${FIREBASE_SERVICE_ACCOUNT_KEY}

encryption:
  key: ${CONTACT_ENCRYPTION_KEY}
  iv: ${CONTACT_ENCRYPTION_IV}

admin:
  kakao-id: ${ADMIN_KAKAO_ID:}

cors:
  allowed-origins: https://www.campushanjang.kr
