cors:
  allowed-origins: "http://localhost:3000"

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # dev 환경 커넥션 풀 확장 — 500명 부하 테스트용 (prod는 application.yml 기준 유지)
  datasource:
    hikari:
      maximum-pool-size: 50

# dev 환경 Tomcat 스레드 풀 확장 — 500명 동시 요청 수용
server:
  tomcat:
    threads:
      max: 600
    accept-count: 200


logging:
  level:
    com.campushanjang: DEBUG
    org.hibernate.SQL: DEBUG

admin:
  kakao-id: "4871940017"

app:
  secure-cookie: false

# dev 환경 rate limit 완화 — 부하 테스트 편의 (prod에서는 적용 안됨)
rate-limit:
  global-per-minute: 100000
  local-login-per-hour: 10000
  # 유저별 per-endpoint 완화: 500VU × 500유저 = 유저당 ~1req/s → 분당 ~60req
  # prod 기본값: cards=30/min, received=10/min
  user-cards-per-minute: 2000
  user-received-per-minute: 2000
