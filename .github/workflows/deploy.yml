name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Copy jar to Oracle VM
        # @master는 리포 탈취 시 SSH 키 유출로 이어진다 — 버전 태그로 핀 고정
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "build/libs/*-SNAPSHOT.jar"
          target: "/home/ubuntu/app/"
          strip_components: 2

      - name: Restart and health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            # 새 jar를 app.jar로 교체 (systemd ExecStart 고정 경로)
            mv /home/ubuntu/app/*-SNAPSHOT.jar /home/ubuntu/app/app.jar
            sudo systemctl restart campus-hanjang

            # 헬스체크 — 90초 내 UP 안 되면 배포 실패 처리
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Health check passed"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed - recent logs:"
            sudo journalctl -u campus-hanjang -n 50 --no-pager
            exit 1